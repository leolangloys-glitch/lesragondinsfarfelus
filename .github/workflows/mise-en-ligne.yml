# Mise en ligne automatique sur GitHub Pages.
# À chaque modification de la branche main (la version en ligne), le site est
# reconstruit et publié. Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les visuels de la graphiste
        run: |
          for f in logo.webp logo-petit.webp cadre-or.webp cadre-or.json escalier.webp sol-damier.svg partage.jpg; do
            if [ ! -f "public/brouillon/$f" ]; then
              echo "::error::Visuel manquant : public/brouillon/$f (ajoutez les visuels validés de la graphiste avant la mise en ligne)"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4

  # Prévient Bing (et donc ChatGPT, Copilot, DuckDuckGo, Qwant…), Yandex, Seznam
  # et Naver que le site a changé (protocole IndexNow). Sans effet sur la mise en
  # ligne si ça échoue. La clé est publique par nature (fichier public/070ec91cfce7ceb1224b9c9875dcca25.txt).
  signaler:
    needs: publier
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Signaler les pages à IndexNow
        env:
          SITE: https://lesragondinsfarfelus.com
          CLE: 070ec91cfce7ceb1224b9c9875dcca25
        run: |
          sleep 60
          urls=$(curl -fsS "$SITE/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' | sed 's/.*/"&"/' | paste -sd, -)
          [ -n "$urls" ] || { echo "Plan du site introuvable"; exit 0; }
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"lesragondinsfarfelus.com\",\"key\":\"$CLE\",\"keyLocation\":\"$SITE/$CLE.txt\",\"urlList\":[$urls]}" \
            -w '\nRéponse IndexNow : %{http_code}\n'
