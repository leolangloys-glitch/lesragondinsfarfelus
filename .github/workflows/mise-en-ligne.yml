# Mise en ligne automatique sur GitHub Pages.
# À chaque modification de la branche main (la version en ligne), le site est
# reconstruit et publié. Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les visuels de la graphiste
        run: |
          for f in logo.webp logo-petit.webp cadre-or.webp cadre-or.json escalier.webp sol-damier.svg partage.jpg; do
            if [ ! -f "public/brouillon/$f" ]; then
              echo "::error::Visuel manquant : public/brouillon/$f (ajoutez les visuels validés de la graphiste avant la mise en ligne)"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
